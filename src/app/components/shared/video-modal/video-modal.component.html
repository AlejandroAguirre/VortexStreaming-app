<div class="modal" [class.modal-hidden]="!videoPlayerService.selectedURL()" (click)="close()">
  <video
    #player
    class="modal-video"
    controls
    playsinline
    (loadedmetadata)="restorePosition()"
    (timeupdate)="onTimeUpdate()"
    (click)="$event.stopPropagation()">
  </video>
  <button class="close-btn" (click)="close()">✕</button>
  <button class="favorite-btn" [class.favorite]="video?.liked" (click)="like(); $event.stopPropagation()">
    {{ video?.liked ? '❤️' : '🤍' }}
  </button>
</div>
