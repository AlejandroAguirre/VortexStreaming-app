<div class="modal" *ngIf="videoUrl" (click)="close()">

<video
  #player
  class="modal-video"
  controls
  autoplay
  [src]="videoUrl"
  (loadedmetadata)="restorePosition()"
  (timeupdate)="onTimeUpdate()"
  (click)="$event.stopPropagation()">
</video>
  <button class="close-btn" (click)="close()">
    ✕
  </button>
  <button class="favorite-btn" [class.favorite]="video?.liked" (click)="like(); $event.stopPropagation()">
    {{ video?.liked ? '❤️' : '🤍' }}
  </button>
</div>
